# https://pre-commit.com
# Run: pre-commit install
# Update: pre-commit autoupdate
#
# Adapted from anders-repo-template (AND-1519). Deliberately OMITS the
# conventional-pre-commit commit-msg hook: this is a writing repo whose
# `Post NNN — title` / free-form essay commit style is intentional.
# No prettier hook on markdown — assembled AGENTS.md must stay byte-exact
# (the AND-1296 prettier landmine).
fail_fast: false

repos:
  - repo: local
    hooks:
      - id: anders-pipeline-scrub
        name: anders-pipeline scrub (.anders artifacts)
        entry: anders-pipeline scrub
        language: system
        files: ^\.anders/
        pass_filenames: true
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # ⛔ Excludes src/posts/ ONLY. A line ending in 2+ spaces is a rendered <br>, not
        # lint. Measured 2026-09-19: 003-amplification has 12 and production renders
        # exactly 12 <br>; 005-the-partner-who-cannot-leave has 8 and renders 8. Both are
        # Milena's, whose text is byte-identical by project rule. Stripping them would
        # silently delete 20 line breaks from live essays.
        # The old exclude was '\.md$' — EVERY markdown file. This one checks AGENTS.md,
        # READMEs and docs for the first time while leaving published prose alone.
        exclude: '^src/posts/'
      - id: end-of-file-fixer
        exclude: '^(AGENTS\.md|AGENTS\.header\.md|AGENTS\.body\.md)$'
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=4000']   # largest cover is 009 at 2,571 KB; 1000 blocked 14 of 17 images
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
